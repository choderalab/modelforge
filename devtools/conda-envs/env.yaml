name: modelforge_env
channels:
  - conda-forge
  - pytorch
dependencies:
  # Base depends
  - python
  - pip
  - h5py
  - tqdm
  - toml
  - qcportal>=0.50
  - qcelemental
  - pytorch>=2.1
  - loguru
  - lightning>=2.0.8
  - tensorboard
  - torchvision
  - openff-units>=0.3.1
  - torchmetrics>=1.4
  - pint>=0.24.1
  - rdkit
  - retry
  - sqlitedict
  - pydantic>=2
  - ray-all
  - graphviz
  - wandb>=0.18.5
  # need to pin to older versions because of explicit conda pins to numpy < 2
  # which loads an older version of tad-dftd3, but a newer, incompatible version of tad-mctc
  - tad-dftd3<= 0.2.2
  - tad-mctc<=0.1.5

  # Testing
  - pytest>=2.1
  - pytest-cov
  - codecov
  - requests
  - versioneer

  - pip:
      #- git+https://github.com/ArnNag/sake.git@nanometer
      - pytest-xdist

