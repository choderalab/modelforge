name: test
channels:
  - conda-forge
  - pytorch
dependencies:
  # Base depends
  - python
  - pip
  - h5py
  - tqdm
  - qcelemental
  - qcportal>=0.50
  - pytorch>=2.1
  - loguru
  - lightning>=2.0.8
  - tensorboard
  - torchvision
  - openff-units
  - torchmetrics>=1.4
  - pint>=0.24.1
  - rdkit
  - retry
  - sqlitedict
  - pydantic>=2
  - ray-all
  - flax
  - jax


  # Testing
  - pytest>=2.1
  - pytest-cov
  - codecov
  - requests
  - versioneer

  # Docs
  - sphinx_rtd_theme
  - nbsphinx
  - ipython

  - pip:
      - torchviz2
      - sphinx-collections